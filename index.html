<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <meta charset="UTF-8" />
    <link rel="preload" as="image" href="/logo5-removebg-preview.png" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#059669" />
    <script>
      (() => {
        let preference = null;
        try {
          preference = localStorage.getItem("hyper-tutor-dark-mode");
        } catch (error) {
          console.error("Error reading theme preference from localStorage:", error);
          preference = null;
        }

        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const dark =
          preference === "dark" ||
          preference === "true" ||
          (preference !== "light" && preference !== "false" && prefersDark);
        const root = document.documentElement;
        root.classList.toggle("dark", dark);
        root.style.colorScheme = dark ? "dark" : "light";
        const themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) themeColor.content = dark ? "#121a18" : "#059669";
      })();
    </script>
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hyper Tutor | AI Learning Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
